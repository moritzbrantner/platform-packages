name: refresh-browser-translation-lock

on:
  push:
    branches:
      - feat/browser-translation
    paths:
      - "packages/browser-translation/**"
      - ".github/workflows/refresh-browser-translation-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/browser-translation

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Prepare compatibility dependencies
        run: bash scripts/prepare-compat-wasm-deps.sh

      - name: Regenerate frozen workspace lock
        run: bun install --lockfile-only

      - name: Commit generated lock if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh browser translation workspace lock"
          git push origin HEAD:feat/browser-translation
