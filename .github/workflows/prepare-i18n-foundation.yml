name: Prepare i18n foundation branch

on:
  push:
    branches:
      - feature/shared-i18n-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Prepare compatibility WASM dependencies
        run: bash scripts/prepare-compat-wasm-deps.sh

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Register package in repository inventory
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "README.md";
          let readme = readFileSync(path, "utf8");

          if (!readme.includes("`@moritzbrantner/i18n`")) {
            const inventoryAnchor = "| `@moritzbrantner/information-extraction`        | experimental      | Implemented or incubating runtime package outside the scaffold release set. |";
            const inventoryRow = "| `@moritzbrantner/i18n`                          | release-ready     | Shared locale resolution, formatting, validation, and React adapters.       |";
            if (!readme.includes(inventoryAnchor)) throw new Error("Package inventory anchor not found.");
            readme = readme.replace(inventoryAnchor, `${inventoryAnchor}\n${inventoryRow}`);

            const packageAnchor = "- `@moritzbrantner/hexagon-grids`: globe-aware H3 hex indexing, polygon coverage, neighborhood/path helpers, and point aggregation into hex cells.";
            const packageLine = "- `@moritzbrantner/i18n`: shared locale resolution, i18next initialization, browser URL/preferences, `Intl` formatting, React bindings, and deterministic translation validation.";
            if (!readme.includes(packageAnchor)) throw new Error("Package description anchor not found.");
            readme = readme.replace(packageAnchor, `${packageAnchor}\n${packageLine}`);

            writeFileSync(path, readme);
          }
          NODE

      - name: Format new package
        run: bunx oxfmt packages/i18n .changeset/add-shared-i18n-foundation.md

      - name: Typecheck package
        run: bun run --filter @moritzbrantner/i18n check-types

      - name: Test package
        run: bun run --filter @moritzbrantner/i18n test

      - name: Build package
        run: bun run --filter @moritzbrantner/i18n build

      - name: Commit generated lockfile and inventory
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock README.md packages/i18n .changeset/add-shared-i18n-foundation.md
          git commit -m "Prepare shared i18n package"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
