name: Parallel Text Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "examples/playground/parallel-text-pages.html"
      - "examples/playground/src/parallel-text-pages.css"
      - "examples/playground/src/parallel-text-pages.tsx"
      - "examples/playground/vite.pages.config.ts"
      - "packages/linguistics-core/**"
      - "packages/parallel-text/**"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build parallel text Pages demo
        working-directory: examples/playground
        run: bunx vite build --config vite.pages.config.ts

      - name: Prepare Pages artifact
        run: |
          cp examples/playground/dist-pages/parallel-text-pages.html examples/playground/dist-pages/index.html
          mkdir -p examples/playground/dist-pages/parallel-text
          cp examples/playground/dist-pages/parallel-text-pages.html examples/playground/dist-pages/parallel-text/index.html
          touch examples/playground/dist-pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/playground/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
