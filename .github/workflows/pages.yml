name: Pages

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "pages/flat-design/**"
      - "packages/flat-design/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pages/flat-design
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install focused Pages dependencies
        run: bun install
      - name: Build focused Pages site
        run: bun run build

  deploy:
    name: Deploy Pages
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@556f65c16362a73dc8a0a36849749fef0e3e64d9 # workflow-standard-v1.3
    with:
      working_directory: "pages/flat-design"
      bun_version: latest
      install_command: bun install
      build_command: bun run build
      artifact_path: dist
      cache_bun: false
      concurrency_group: platform-packages-pages
      cancel_in_progress: false
