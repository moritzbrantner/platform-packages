name: format-browser-translation

on:
  push:
    branches:
      - feat/browser-translation
    paths:
      - "README.md"
      - "packages/browser-translation/**"
      - ".github/workflows/format-browser-translation.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/browser-translation

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Format browser translation slice with pinned Oxfmt
        run: |
          bunx oxfmt@0.46.0 \
            README.md \
            packages/browser-translation/src/browser.ts \
            packages/browser-translation/src/browser.test.ts

      - name: Commit slice formatting if changed
        run: |
          paths=(
            README.md
            packages/browser-translation/src/browser.ts
            packages/browser-translation/src/browser.test.ts
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "browser translation slice is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "style: format browser translation slice"
          git push origin HEAD:feat/browser-translation
