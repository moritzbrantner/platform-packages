name: Publish Private Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_PACKAGES_TOKEN: ${{ github.token }}
  NODE_AUTH_TOKEN: ${{ github.token }}

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          registry-url: "https://npm.pkg.github.com"
          scope: "@moritzbrantner"

      - name: Verify prebuilt dependency integrity
        run: node scripts/verify-prebuilt-dependencies.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run release:lint

      - name: Typecheck
        run: bun run release:typecheck

      - name: Build
        run: bun run release:build

      - name: Test
        run: bun run release:test

      - name: Publish workspace packages
        run: bun run release:publish
