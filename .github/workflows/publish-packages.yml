name: Publish Private Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@moritzbrantner"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run release:lint

      - name: Typecheck
        run: bun run release:typecheck

      - name: Build
        run: bun run release:build

      - name: Test
        run: bun run release:test

      - name: Publish workspace packages
        run: bun run release:publish
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
