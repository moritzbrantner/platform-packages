name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Show canonical formatting diff
        run: |
          bunx oxfmt@0.46.0 .
          git diff --exit-code -- .

  verify:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@workflow-standard-v1.2
    with:
      install_command: bash scripts/prepare-compat-wasm-deps.sh && bun install --frozen-lockfile
      lint_command: bun run lint
      typecheck_command: bun run typecheck
      test_command: bun run test
      build_command: bun run build
