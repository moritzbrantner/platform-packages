name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-fix:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Apply canonical formatting
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          bunx oxfmt@0.46.0 .
          if git diff --quiet -- .; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply canonical formatting"
          git push origin "HEAD:${HEAD_REF}"

  verify:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@workflow-standard-v1.2
    with:
      install_command: bash scripts/prepare-compat-wasm-deps.sh && bun install --frozen-lockfile
      lint_command: bun run lint
      typecheck_command: bun run typecheck
      test_command: bun run test
      build_command: bun run build
