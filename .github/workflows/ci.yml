name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@a11ca7f3feaca0936803308cf4b150b4150cb99c
    with:
      bun_version: "1.4.2"
      install_command: node scripts/verify-prebuilt-dependencies.mjs && bun install --frozen-lockfile
      command: ${{ github.event_name == 'pull_request' && 'bun run lint && bun run typecheck && bun run test && bash scripts/verify-isolated-install.sh && bun run build' || 'bun run lint && bun run typecheck && bun run test && bun run build' }}
