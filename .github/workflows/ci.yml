name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@45042e56be120b438096e774027637cac0280075
    with:
      install_command: bash scripts/prepare-compat-wasm-deps.sh && bun install --frozen-lockfile
      command: ${{ github.event_name == 'pull_request' && 'bun run lint && bun run typecheck && bun run test' || 'bun run lint && bun run typecheck && bun run test && bun run build' }}
