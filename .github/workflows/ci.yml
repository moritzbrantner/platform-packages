name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@scaffold-v2-initial
    secrets:
      node_auth_token: ${{ github.token }}
    with:
      install_command: bash scripts/prepare-compat-wasm-deps.sh && bun install --frozen-lockfile
      lint_command: bun run lint
      typecheck_command: bun run typecheck
      test_command: bun run test
      build_command: bun run build
